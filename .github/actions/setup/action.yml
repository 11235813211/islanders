name: Set up Node and dependencies
description: Node from .nvmrc, with node_modules restored from cache when package-lock.json is unchanged.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
