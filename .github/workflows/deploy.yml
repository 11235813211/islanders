name: Deploy Islanders
on:
  # By hand only (Actions → Deploy Islanders → Run workflow); pushes to main no longer deploy.
  # Still requires a passing Verify on the commit.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SHA: ${{ github.sha }}
    steps:
      - name: Require a passing Verify run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --commit "$SHA" \
            --status success --json databaseId --jq 'length')
          if [ "$passed" = "0" ]; then
            echo "::error::Verify has not passed for ${SHA::7}. Wait for it to finish (or re-run it), then deploy."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npx wrangler deploy --var DEV_MODE:false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
