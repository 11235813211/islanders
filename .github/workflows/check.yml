name: Verify game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, unit tests, and build: fast, and independent of the browser tests below.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run check

  # Browser tests, split across three runners that run at the same time. Tests tagged @local
  # (layout sweeps across widths, art reviews) run only locally (npm run test:e2e).
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browsers
      - run: npm run test:e2e:ci -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Tests that play whole games in real time: one runner of their own so they don't hold up the others.
  browsers-slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browsers
      - run: npm run test:e2e:slow
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-slow
          path: test-results/
          retention-days: 7
