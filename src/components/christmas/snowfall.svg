<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260">
  <!-- Snowflakes scattered on the Christmas page background (christmas-theme.css tiles this). The
       flake is the tiles' Snowflake (src/art/v20/christmas/effects.tsx): six branched arms, white
       over a pale blue edge. -->
  <defs>
    <path id="arm" d="M0 0V-8M0-4.4l-2.2-2.1M0-4.4l2.2-2.1" />
    <g id="flake" fill="none" stroke-linecap="round">
      <g stroke="#9cc4dc" stroke-width="2.8" opacity=".55">
        <use xlink:href="#arm" /><use xlink:href="#arm" transform="rotate(60)" /><use xlink:href="#arm" transform="rotate(120)" />
        <use xlink:href="#arm" transform="rotate(180)" /><use xlink:href="#arm" transform="rotate(240)" /><use xlink:href="#arm" transform="rotate(300)" />
      </g>
      <g stroke="#ffffff" stroke-width="1.6">
        <use xlink:href="#arm" /><use xlink:href="#arm" transform="rotate(60)" /><use xlink:href="#arm" transform="rotate(120)" />
        <use xlink:href="#arm" transform="rotate(180)" /><use xlink:href="#arm" transform="rotate(240)" /><use xlink:href="#arm" transform="rotate(300)" />
      </g>
      <circle r="1.6" fill="#ffffff" stroke="none" />
    </g>
  </defs>
  <use xlink:href="#flake" transform="translate(32 46) rotate(10) scale(.9)" />
  <use xlink:href="#flake" transform="translate(164 24) rotate(25) scale(.6)" />
  <use xlink:href="#flake" transform="translate(214 116) rotate(5) scale(1)" />
  <use xlink:href="#flake" transform="translate(94 150) rotate(40) scale(.7)" />
  <use xlink:href="#flake" transform="translate(22 218) rotate(18) scale(.55)" />
  <use xlink:href="#flake" transform="translate(178 222) rotate(33) scale(.8)" />
</svg>
