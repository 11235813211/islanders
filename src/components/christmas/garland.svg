<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="46" viewBox="0 0 120 46">
  <!-- One swag of the panel garland (christmas-theme.css repeats it): pine boughs, spiky holly leaves, and red berries, drooping between the ends. -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#8fd05a" />
      <stop offset=".5" stop-color="#4fa83a" />
      <stop offset="1" stop-color="#2c7a2a" />
    </linearGradient>
    <radialGradient id="berry" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#ff7a6e" />
      <stop offset=".45" stop-color="#e0262f" />
      <stop offset="1" stop-color="#9c1118" />
    </radialGradient>
    <!-- A holly leaf from its stem at the origin to its tip at (16, 0). -->
    <g id="holly">
      <path d="M0 0Q3-1 4-4.6Q6.4-2.8 8-5.8Q9.6-2.8 12-4.6Q13-1.2 16 0Q13 1.2 12 4.6Q9.6 2.8 8 5.8Q6.4 2.8 4 4.6Q3 1 0 0Z" fill="url(#leaf)" stroke="#23611f" stroke-width=".5" stroke-linejoin="round" />
      <path d="M.6 0Q8-.6 15 0" fill="none" stroke="#c4eaa0" stroke-width=".7" stroke-linecap="round" />
    </g>
    <!-- A pine tuft: needles fanning from (0, 0) toward +x. -->
    <g id="pine" fill="none" stroke-linecap="round">
      <path d="M0 0L11 0M3 0l3-3.4M3 0l3 3.4M6 0l3.2-3.4M6 0l3.2 3.4M8.6 0l2.6-2.6M8.6 0l2.6 2.6M1 0l2.4-3M1 0l2.4 3" stroke="#1d5a2c" stroke-width="1" />
      <path d="M4 0l3-2.6M4.4 0l3 2.6M7.4 0l2.4-2.2" stroke="#4f8f52" stroke-width=".6" />
    </g>
    <g id="berries">
      <circle cx="-2.4" cy="-.6" r="2.6" fill="url(#berry)" />
      <circle cx="2.4" cy="-.8" r="2.6" fill="url(#berry)" />
      <circle cx="0" cy="2.4" r="2.6" fill="url(#berry)" />
      <circle cx="-3.2" cy="-1.5" r=".7" fill="#fff" opacity=".7" />
      <circle cx="1.6" cy="-1.7" r=".7" fill="#fff" opacity=".7" />
      <circle cx="-.8" cy="1.5" r=".7" fill="#fff" opacity=".7" />
    </g>
  </defs>
  <g transform="translate(0 8)">
  <!-- The bough: a twig along the droop, with pine tufts pointing both ways. -->
  <path d="M-2 7Q30 21 60 21T122 7" fill="none" stroke="#5b3a22" stroke-width="1.2" />
  <use xlink:href="#pine" transform="translate(2 8) rotate(-60)" />
  <use xlink:href="#pine" transform="translate(4 9) rotate(40)" />
  <use xlink:href="#pine" transform="translate(16 15) rotate(-130)" />
  <use xlink:href="#pine" transform="translate(22 17) rotate(55)" />
  <use xlink:href="#pine" transform="translate(40 20) rotate(-110)" />
  <use xlink:href="#pine" transform="translate(48 21) rotate(80)" />
  <use xlink:href="#pine" transform="translate(72 21) rotate(-70)" />
  <use xlink:href="#pine" transform="translate(80 20) rotate(100)" />
  <use xlink:href="#pine" transform="translate(98 17) rotate(-50)" />
  <use xlink:href="#pine" transform="translate(104 15) rotate(125)" />
  <use xlink:href="#pine" transform="translate(116 9) rotate(-30)" />
  <use xlink:href="#pine" transform="translate(118 8) rotate(-120)" />
  <!-- Holly leaves in pairs along the bough, fanning up and down. -->
  <use xlink:href="#holly" transform="translate(8 11) rotate(-115)" />
  <use xlink:href="#holly" transform="translate(9 11) rotate(-30)" />
  <use xlink:href="#holly" transform="translate(28 18) rotate(-80)" />
  <use xlink:href="#holly" transform="translate(28 19) rotate(150)" />
  <use xlink:href="#holly" transform="translate(32 19) rotate(35)" />
  <use xlink:href="#holly" transform="translate(54 21) rotate(-130)" />
  <use xlink:href="#holly" transform="translate(60 21) rotate(-90)" />
  <use xlink:href="#holly" transform="translate(66 21) rotate(-50)" />
  <use xlink:href="#holly" transform="translate(58 22) rotate(110)" />
  <use xlink:href="#holly" transform="translate(62 22) rotate(70)" />
  <use xlink:href="#holly" transform="translate(88 19) rotate(-100)" />
  <use xlink:href="#holly" transform="translate(88 19) rotate(30)" />
  <use xlink:href="#holly" transform="translate(92 18) rotate(145)" />
  <use xlink:href="#holly" transform="translate(111 11) rotate(-65)" />
  <use xlink:href="#holly" transform="translate(112 11) rotate(-150)" />
  <!-- Berry clusters where the leaves meet. -->
  <use xlink:href="#berries" transform="translate(14 13)" />
  <use xlink:href="#berries" transform="translate(39 21)" />
  <use xlink:href="#berries" transform="translate(60 23)" />
  <use xlink:href="#berries" transform="translate(81 21)" />
  <use xlink:href="#berries" transform="translate(106 13)" />
  </g>
</svg>
