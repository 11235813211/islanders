<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Holly that caps the garland at a panel's right end. -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#8fd05a" /><stop offset=".5" stop-color="#4fa83a" /><stop offset="1" stop-color="#2c7a2a" />
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#6cbf45" /><stop offset=".5" stop-color="#3a8f30" /><stop offset="1" stop-color="#215f22" />
    </linearGradient>
    <radialGradient id="berry" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#ff7a6e" /><stop offset=".45" stop-color="#e0262f" /><stop offset="1" stop-color="#9c1118" />
    </radialGradient>
    <g id="holly">
      <path d="M0 0Q3-1 4-4.6Q6.4-2.8 8-5.8Q9.6-2.8 12-4.6Q13-1.2 16 0Q13 1.2 12 4.6Q9.6 2.8 8 5.8Q6.4 2.8 4 4.6Q3 1 0 0Z" fill="url(#leaf)" stroke="#23611f" stroke-width=".5" stroke-linejoin="round" />
      <path d="M.6 0Q8-.6 15 0" fill="none" stroke="#c4eaa0" stroke-width=".7" stroke-linecap="round" />
    </g>
    <g id="holly2">
      <path d="M0 0Q3-1 4-4.6Q6.4-2.8 8-5.8Q9.6-2.8 12-4.6Q13-1.2 16 0Q13 1.2 12 4.6Q9.6 2.8 8 5.8Q6.4 2.8 4 4.6Q3 1 0 0Z" fill="url(#leaf2)" stroke="#1b4f1a" stroke-width=".5" stroke-linejoin="round" />
      <path d="M.6 0Q8-.6 15 0" fill="none" stroke="#a9db86" stroke-width=".7" stroke-linecap="round" />
    </g>
    <g id="pine" fill="none" stroke-linecap="round">
      <path d="M0 0L11 0M3 0l3-3.4M3 0l3 3.4M6 0l3.2-3.4M6 0l3.2 3.4M8.6 0l2.6-2.6M8.6 0l2.6 2.6M1 0l2.4-3M1 0l2.4 3" stroke="#1d5a2c" stroke-width="1" />
      <path d="M4 0l3-2.6M4.4 0l3 2.6M7.4 0l2.4-2.2" stroke="#4f8f52" stroke-width=".6" />
    </g>
    <g id="b"><circle r="2.6" fill="url(#berry)" /><circle cx="-.8" cy="-.9" r=".7" fill="#fff" opacity=".7" /></g>
  </defs>
  <g transform="matrix(-1 0 0 1 40 0)">
    <use href="#pine" transform="translate(20 20) rotate(-140)" />
    <use href="#pine" transform="translate(20 20) rotate(-90)" />
    <use href="#pine" transform="translate(20 20) rotate(-40)" />
    <use href="#pine" transform="translate(20 20) rotate(10)" />
    <use href="#pine" transform="translate(20 20) rotate(55)" />
    <use href="#pine" transform="translate(20 20) rotate(170)" />
    <use href="#pine" transform="translate(20 20) rotate(115)" />
    <use href="#holly2" transform="translate(20 20) rotate(-160) scale(1.1)" />
    <use href="#holly" transform="translate(20 20) rotate(-110) scale(1.15)" />
    <use href="#holly" transform="translate(20 20) rotate(-60) scale(1.1)" />
    <use href="#holly2" transform="translate(20 20) rotate(-10) scale(1.05)" />
    <use href="#holly" transform="translate(20 20) rotate(35) scale(1)" />
    <use href="#holly" transform="translate(20 20) rotate(150) scale(1)" />
    <use href="#holly2" transform="translate(20 20) rotate(95) scale(0.9)" />
    <use href="#b" transform="translate(17.4 20.4)" />
    <use href="#b" transform="translate(22.6 20.2)" />
    <use href="#b" transform="translate(20 23.6)" />
    <use href="#b" transform="translate(19.8 17.4)" />
    <use href="#b" transform="translate(24.6 23.8)" />
  </g>
</svg>
